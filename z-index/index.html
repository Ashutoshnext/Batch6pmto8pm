<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- z-index -->
    <style>
        .box {
            width: 200px;
            height: 400px;
            border: 1px solid red;
            background-color: #b49292;
            position: relative;

        }

        .box:nth-child(1) {
            z-index:- 999;
        }

        .box:nth-child(2) {
            margin-top: -150px;
            border: 1px solid black;
            background-color: red;
            z-index: 999;
        }
    </style>
</head>

<body>

    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>

</body>

</html>
