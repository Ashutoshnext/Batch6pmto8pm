<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            background-color: #841b1b;
            height: 100vh;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 22px;
        }

        @media (max-width:1080px) and (min-width:750px) {
            .container {
                width: 100%;
                background-color: #1b8426;
                height: 100vh;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 15px;
            }

        }

         @media (max-width:750px) and (min-width:0px) {
            .container {
                width: 100%;
                background-color: #0d0d0d;
                height: 100vh;
                color: aliceblue;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Media Query</h1>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Cum, iusto minima consectetur, adipisci animi velit
            expedita doloribus praesentium porro officia deserunt facilis!</p>
    </div>

</body>

</html>
