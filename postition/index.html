<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            border: 1px solid red;
            display: flex;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin: 40px; 
          
        }

        .box2{
            position: absolute;
            top: 20px;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">4</div>
    </div>
</body>

</html>
